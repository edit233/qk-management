name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inject env file on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            printf 'MYSQL_HOST=mysql\n' > /opt/qk-management/.env
            printf 'MYSQL_PORT=3306\n' >> /opt/qk-management/.env
            printf 'MYSQL_DB=qk\n' >> /opt/qk-management/.env
            printf 'MYSQL_USER=qk\n' >> /opt/qk-management/.env
            printf 'MYSQL_PASSWORD=%s\n' "${{ secrets.MYSQL_PASSWORD }}" >> /opt/qk-management/.env
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "${{ secrets.MYSQL_ROOT_PASSWORD }}" >> /opt/qk-management/.env
            printf 'APP_PORT=90\n' >> /opt/qk-management/.env
            printf 'OSS_ENDPOINT=%s\n' "${{ secrets.OSS_ENDPOINT }}" >> /opt/qk-management/.env
            printf 'OSS_BUCKET_NAME=%s\n' "${{ secrets.OSS_BUCKET_NAME }}" >> /opt/qk-management/.env
            printf 'OSS_ACCESS_KEY_ID=%s\n' "${{ secrets.OSS_ACCESS_KEY_ID }}" >> /opt/qk-management/.env
            printf 'OSS_ACCESS_KEY_SECRET=%s\n' "${{ secrets.OSS_ACCESS_KEY_SECRET }}" >> /opt/qk-management/.env

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/qk-management
            git pull origin main
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f