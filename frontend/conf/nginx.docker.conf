worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_token $auth_status {
        default 0;
        ~.+     1;
    }

    server {
        listen       80;
        server_name  localhost;
        client_max_body_size 10m;

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location /api {
            # 登录接口放行
            set $block_access 0;
            if ($request_uri ~* "^/api/login$") {
                set $block_access 1;
            }
            if ($auth_status = 0) {
                set $block_access "${block_access}0";
            }
            if ($block_access = "00") {
                return 401 '{"code":0,"msg":"未登录","data":null}';
            }

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8080;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}