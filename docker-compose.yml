services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-edit233}/qk-management-backend:${IMAGE_TAG:-latest}
    container_name: qk-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DB:-qk}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-qk}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-123456}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB:-qk}
      - MYSQL_USER=${MYSQL_USER:-qk}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-123456}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-giao233}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-edit233}/qk-management-frontend:${IMAGE_TAG:-latest}
    container_name: qk-frontend
    restart: always
    ports:
      - "${APP_PORT:-90}:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: qk-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-qk}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: