# ============================================================================
# 测试配置（提交到 git）
# ============================================================================
# 测试时 Spring Boot 会先加载 main 的 application.yaml，再加载本文件。
# 这里**不强制**写 datasource / OSS，避免在 CI 缺环境变量时启动失败。
# 测试代码如需真实连接，请用 @TestPropertySource 注解或测试 profile 文件。
# ============================================================================

# 测试日志只输出 warn+，让 CI 输出更干净
logging:
  level:
    root: warn
    org.springframework: warn
    com.qk: info
    com.itheima: info