# ============================================================================
# 公共配置（提交到 git，不含任何真实密钥）
# ============================================================================
# 所有字段都使用 ${PLACEHOLDER:默认值} 语法：
#   - 本地 IDEA Run：直接使用默认值启动（零配置）
#   - docker-compose / deploy.sh：通过环境变量注入真实密钥
#   - 个人覆盖：复制 application-local.yaml.example 为 application-local.yaml
#     （已在 .gitignore 中屏蔽，绝不提交）填入自己的真实值覆盖默认
#
# 12-factor：真实密钥只通过环境变量 / profile 文件注入，不进 git。
# ============================================================================

spring:
  application:
    name: qk-management
  profiles:
    active: local     # IDEA 默认激活 local；docker-compose 用 env SPRING_PROFILES_ACTIVE 覆盖

  # ---- 数据库 ----
  # placeholder 形式：本地默认 root/123456（开发常用），部署时通过 env 覆盖
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qk?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  # ---- 阿里云 OSS（开发期留空也能启动，仅 OSS 上传会报错） ----
  # 注意 OSS 配置类如果读取了空 accessKeySecret，调用 OSS API 时会失败，
  # 但 Spring Boot 启动本身不会报错——业务 CRUD 接口可正常测试。

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mappers/*.xml

# ---- 应用自定义 OSS 配置 ----
qk:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET_NAME:default-bucket}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

# ---- 日志 ----
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug